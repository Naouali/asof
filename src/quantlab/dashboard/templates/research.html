<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuantLab</title>
<style>
:root{color-scheme:light dark;
 --fg:#11151b;--bg:#f6f7f9;--card:#fff;--muted:#6b7480;--line:#e3e6ea;
 --ok:#127a45;--warn:#9a6300;--bad:#c0392b;--accent:#1a3d6d;
 --c1:#1a3d6d;--c2:#c0392b;--c3:#127a45;--c4:#9a6300;--c5:#6b3fa0;}
@media(prefers-color-scheme:dark){:root{
 --fg:#e7eaee;--bg:#0f1216;--card:#171b21;--muted:#95a0ad;--line:#262c34;
 --ok:#4cc38a;--warn:#e2a03f;--bad:#f2555a;--accent:#7aa7e0;
 --c1:#7aa7e0;--c2:#f2555a;--c3:#4cc38a;--c4:#e2a03f;--c5:#b18cf0;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
 font:13.5px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.shell{display:flex;min-height:100vh}
nav{width:200px;flex:0 0 200px;background:var(--card);border-right:1px solid var(--line);
 padding:18px 0;position:sticky;top:0;height:100vh}
nav h1{font-size:15px;margin:0 18px 2px;letter-spacing:-.01em}
nav .v{font-size:11px;color:var(--muted);margin:0 18px 18px}
nav a{display:block;padding:8px 18px;color:var(--muted);text-decoration:none;
 font-size:13px;border-left:2px solid transparent;cursor:pointer}
nav a:hover{color:var(--fg)}
nav a.on{color:var(--fg);font-weight:600;border-left-color:var(--accent);background:var(--bg)}
nav .foot{position:absolute;bottom:16px;left:18px;right:18px;font-size:11px;color:var(--muted)}
main{flex:1;padding:22px 26px 60px;max-width:1400px}
h2{font-size:18px;margin:0 0 3px;letter-spacing:-.01em}
.lede{color:var(--muted);margin:0 0 20px;font-size:13px;max-width:70ch}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:12px 14px}
.kpi .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kpi .v{font-size:21px;font-weight:650;margin-top:3px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11px;color:var(--muted);margin-top:1px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:16px;margin-bottom:18px}
.panel h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
 margin:0 0 12px;font-weight:650}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);font-size:12.5px}
th{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:650}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--bg)}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
 padding:2px 6px;border-radius:4px;border:1px solid currentColor}
.t-ok{color:var(--ok)}.t-warn{color:var(--warn)}.t-bad{color:var(--bad)}
.verdict{padding:12px 14px;border-radius:8px;background:var(--bg);border-left:3px solid var(--muted);
 white-space:pre-wrap;font-size:12.5px;margin-bottom:14px}
.verdict.bad{border-left-color:var(--bad)}.verdict.good{border-left-color:var(--ok)}
.warn{background:var(--bg);border-left:3px solid var(--warn);padding:9px 12px;
 margin:7px 0;font-size:12.5px;color:var(--fg);border-radius:0 6px 6px 0}
label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
 color:var(--muted);font-weight:650;margin:12px 0 4px}
input,select,textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;
 background:var(--bg);color:var(--fg);font:13px ui-sans-serif,system-ui,sans-serif}
textarea{font:12px ui-monospace,Menlo,monospace;min-height:58px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 14px}
button{margin-top:14px;padding:8px 16px;border-radius:6px;border:1px solid var(--accent);
 background:var(--accent);color:#fff;font-weight:600;font-size:13px;cursor:pointer}
button:disabled{opacity:.45;cursor:progress}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.muted{color:var(--muted)}
.spin{color:var(--muted);font-size:12.5px}
svg{display:block;width:100%;height:auto}
.axis{font-size:9.5px;fill:var(--muted)}
.grid-l{stroke:var(--line);stroke-width:1}
.search{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.search input{flex:1;font-size:14px;padding:9px 12px}
.search .n{font-size:12px;color:var(--muted);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{font-size:10.5px;padding:2px 6px;border-radius:4px;background:var(--bg);
 border:1px solid var(--line);color:var(--muted)}
.hm td{padding:0;border:0}
.hm .lbl{font-size:10.5px;color:var(--muted);padding:2px 6px;white-space:nowrap}
.hm .cell{width:34px;height:26px;text-align:center;font-size:10px;color:#fff;
 font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:900px){.two{grid-template-columns:1fr}}
</style>

<div class="shell">
<nav>
  <h1>QuantLab</h1>
  <div class="v">v{{ version }}</div>
  <a class="on" data-v="instruments">Instruments</a>
  <a data-v="portfolio">Portfolio</a>
  <a data-v="overview">Strategies</a>
  <a data-v="signals">Signals</a>
  <a data-v="sweep">Sweep</a>
  <a data-v="data">Data</a>
  <a data-v="trials">Trials</a>
  <div class="foot">Research and paper trading only.<br>No live order routing.</div>
</nav>
<main>
  <div id="view"></div>
</main>
</div>

<script>
const $ = s => document.querySelector(s);
const H = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const N = (x, d=2) => (x===null||x===undefined||Number.isNaN(x)) ? "—" : Number(x).toFixed(d);
const P = (x, d=1) => (x===null||x===undefined) ? "—" : (100*Number(x)).toFixed(d)+"%";
const SIGN = (x, d=2) => (x===null||x===undefined) ? "—" : (x>=0?"+":"")+Number(x).toFixed(d);
const COLORS = ["--c1","--c2","--c3","--c4","--c5"].map(v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim());
const get = async u => (await fetch(u)).json();
const post = async (u,b) => (await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)})).json();

/* ----------------------------------------------------------- charts (SVG) */
function lineChart(series, {w=980,h=260,pad=34,log=true,yfmt=N}={}) {
  const all = series.flatMap(s=>s.points);
  if (all.length < 2) return `<p class="muted">not enough data to chart</p>`;
  const xs = all.map(p=>p.x), ys = all.map(p=>p.y).filter(v=>v>0 || !log);
  const x0=Math.min(...xs), x1=Math.max(...xs);
  const tf = v => log ? Math.log(v) : v;
  let y0=Math.min(...ys.map(tf)), y1=Math.max(...ys.map(tf));
  if (y0===y1){y0-=1;y1+=1}
  const X = v => pad + (w-pad-12)*(v-x0)/((x1-x0)||1);
  const Y = v => pad*0.4 + (h-pad-18)*(1-(tf(v)-y0)/((y1-y0)||1));
  const gridY = [0,.25,.5,.75,1].map(f=>{
    const yv=y0+f*(y1-y0), py=Y(log?Math.exp(yv):yv);
    return `<line class="grid-l" x1="${pad}" x2="${w-12}" y1="${py}" y2="${py}"/>
            <text class="axis" x="4" y="${py+3}">${yfmt(log?Math.exp(yv):yv)}</text>`;}).join("");
  const paths = series.map((s,i)=>{
    const d = s.points.filter(p=>!log||p.y>0).map((p,j)=>`${j?"L":"M"}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join("");
    return `<path d="${d}" fill="none" stroke="${COLORS[i%COLORS.length]}" stroke-width="1.7"/>`;}).join("");
  return `<svg viewBox="0 0 ${w} ${h}" role="img">${gridY}${paths}</svg>`;
}
function barChart(items, {w=980, bar=22, fmt=SIGN}={}) {
  if (!items.length) return `<p class="muted">nothing to chart</p>`;
  const h = items.length*bar + 14;
  const mx = Math.max(...items.map(i=>Math.abs(i.v)), 1e-9);
  const mid = 210, span = w - mid - 80;
  return `<svg viewBox="0 0 ${w} ${h}" role="img">` + items.map((it,i)=>{
    const y=i*bar+4, len=Math.abs(it.v)/mx*span*0.5;
    const x=it.v>=0?mid:mid-len, col=it.color||(it.v>=0?COLORS[0]:COLORS[1]);
    return `<text class="axis" x="0" y="${y+bar*0.62}" style="font-size:11px;fill:var(--fg)">${H(it.k)}</text>
      <rect x="${x}" y="${y+3}" width="${Math.max(len,1)}" height="${bar-9}" fill="${col}" opacity=".85" rx="2"/>
      <text class="axis" x="${mid+span*0.5+8}" y="${y+bar*0.62}">${fmt(it.v)}</text>`;
  }).join("") + `<line class="grid-l" x1="${mid}" x2="${mid}" y1="0" y2="${h-10}"/></svg>`;
}

/* --------------------------------------------------------------- overview */
async function viewOverview() {
  $("#view").innerHTML = `<h2>Strategies</h2><p class="spin">loading…</p>`;
  const {strategies} = await get("/api/strategies");
  if (!strategies.length) {
    $("#view").innerHTML = `<h2>Strategies</h2>
      <p class="lede">Nothing backtested yet. Run one and it appears here:</p>
      <div class="panel"><code>quantlab backtest -c configs/backtest_example.yaml</code></div>`;
    return;
  }
  const full = await Promise.all(strategies.map(s=>get("/api/strategies/"+encodeURIComponent(s.name))));
  const series = full.filter(f=>f.ok).map(f=>({
    name:f.name, points:(f.curve||[]).map(p=>({x:Date.parse(p.t), y:p.equity}))}));

  const surviving = strategies.filter(s=>!s.is_disqualified).length;
  const kpis = [
    ["Strategies", strategies.length, "backtested and stored"],
    ["Survive deflation", surviving, surviving? "" : "none of them"],
    ["Best deflated Sharpe", N(Math.max(...strategies.map(s=>s.deflated_sharpe??0)),3), "0.95 is the bar"],
    ["Total trials", strategies.reduce((a,s)=>a+(s.trials||0),0), "every one deflates the next"],
  ].map(([k,v,s])=>`<div class="kpi"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join("");

  const rows = strategies.map(s=>`<tr class="click" onclick="viewStrategy('${H(s.name)}')">
    <td><b>${H(s.name)}</b></td>
    <td class="n">${N(s.deflated_sharpe,3)}</td>
    <td class="n">${N(s.sharpe_after_haircuts)}</td>
    <td class="n">${N(s.sharpe_undeflated_net)}</td>
    <td class="n">${s.trials??"—"}</td>
    <td class="n">${P(s.cagr)}</td>
    <td class="n">${P(s.max_drawdown)}</td>
    <td class="n">${P(s.turnover,0)}</td>
    <td class="n">${N(s.cost_drag_bps,0)}</td>
    <td>${s.is_disqualified?'<span class="tag t-bad">not evidence</span>':'<span class="tag t-ok">survives</span>'}</td></tr>`).join("");

  $("#view").innerHTML = `<h2>Strategies</h2>
   <p class="lede">Ranked by deflated Sharpe, which is the Sharpe after correcting for how
    many things were tried. The undeflated column is shown because the gap between them is
    the point, not because it is the result.</p>
   <div class="cards">${kpis}</div>
   <div class="panel"><h3>Equity curves — log scale</h3>
     ${lineChart(series,{yfmt:v=>(v/1e6).toFixed(1)+"m"})}
     <div class="legend">${series.map((s,i)=>`<span><i style="background:${COLORS[i%COLORS.length]}"></i>${H(s.name)}</span>`).join("")}</div>
   </div>
   <div class="panel"><h3>Deflated Sharpe — 0.95 clears the bar</h3>
     ${barChart(strategies.map(s=>({k:s.name,v:s.deflated_sharpe??0,
        color:(s.deflated_sharpe??0)>=0.95?COLORS[2]:COLORS[1]})),{fmt:v=>N(v,3)})}
   </div>
   <div class="panel"><h3>Comparison</h3><div style="overflow-x:auto"><table>
     <tr><th>Strategy</th><th class="n">Deflated</th><th class="n">After haircuts</th>
     <th class="n">Undeflated</th><th class="n">Trials</th><th class="n">CAGR</th>
     <th class="n">Max DD</th><th class="n">Turnover</th><th class="n">Cost bp/yr</th><th></th></tr>
     ${rows}</table></div></div>`;
}

/* ------------------------------------------------------------ one strategy */
async function viewStrategy(name) {
  $("#view").innerHTML = `<p class="spin">loading ${H(name)}…</p>`;
  const d = await get("/api/strategies/"+encodeURIComponent(name));
  if (!d.ok) { $("#view").innerHTML = `<div class="verdict bad">${H(d.error)}</div>`; return; }
  const h = d.headline, c = d.curve||[];
  const kpis = [
    ["Deflated Sharpe", N(h.deflated_sharpe,3), `over ${h.trials} trial(s)`],
    ["After haircuts", N(h.sharpe_after_haircuts), "selection + decay"],
    ["Undeflated net", N(h.sharpe_undeflated_net), "upper bound"],
    ["CAGR", P(h.cagr), ""],
    ["Max drawdown", P(h.max_drawdown), ""],
    ["Break-even AUM", h.break_even_aum? "$"+(h.break_even_aum/1e6).toFixed(1)+"m":"none", "capacity"],
  ].map(([k,v,s])=>`<div class="kpi"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join("");

  const costs = Object.entries(d.costs||{}).filter(([,v])=>Math.abs(v)>0.05)
      .sort((a,b)=>b[1]-a[1]).map(([k,v])=>({k,v}));
  const panels = (d.panels||[]).map(p=>`<div class="panel">
      <h3>${H(p.title)} ${p.severity!=="informational"?`<span class="tag t-${p.severity==="disqualifying"?"bad":"warn"}">${H(p.severity)}</span>`:""}</h3>
      <table>${p.rows.map(r=>`<tr><td>${H(r.label)}</td><td class="n">${H(r.value)}</td>
        <td class="muted">${H(r.note)}</td></tr>`).join("")}</table>
      ${p.warnings.map(w=>`<div class="warn">${H(w)}</div>`).join("")}</div>`).join("");

  $("#view").innerHTML = `<h2>${H(d.name)}</h2>
    <p class="lede"><a onclick="go('overview')" style="cursor:pointer;color:var(--accent)">&larr; all strategies</a></p>
    <div class="verdict ${d.is_disqualified?"bad":"good"}">${H(d.verdict)}</div>
    <div class="cards">${kpis}</div>
    <div class="panel"><h3>Equity — log scale</h3>
      ${lineChart([{name:d.name,points:c.map(p=>({x:Date.parse(p.t),y:p.equity}))}],{yfmt:v=>(v/1e6).toFixed(2)+"m"})}</div>
    <div class="panel"><h3>Drawdown</h3>
      ${lineChart([{name:"dd",points:c.map(p=>({x:Date.parse(p.t),y:p.drawdown}))}],{log:false,h:150,yfmt:v=>P(v,0)})}</div>
    ${costs.length?`<div class="panel"><h3>Cost decomposition — bp per year</h3>
      ${barChart(costs,{fmt:v=>N(v,1)})}</div>`:""}
    ${panels}`;
}

/* --------------------------------------------------------------- signals */
async function viewSignals() {
  const {signals} = await get("/api/signals");
  const opts = signals.map(s=>`<option value="${H(s.name)}">${H(s.name)} — tier ${s.tier}, ${H(s.evidence)}</option>`).join("");
  $("#view").innerHTML = `<h2>Signals</h2>
   <p class="lede">Scores, never weights — portfolio construction owns sizing. Every signal
    declares how it is known to fail; that text is the most useful thing on this page.</p>
   <div class="panel"><div class="form">
     <div><label>Signal</label><select id="sg">${opts}</select></div>
     <div><label>As of</label><input id="sa" value="{{ today }}"></div>
     <div><label>Instruments (blank = all)</label><input id="sy" placeholder="SPY, QQQ, TLT"></div>
   </div><button onclick="runSignal()">Compute scores</button></div>
   <div id="so"></div>
   <div class="panel"><h3>Library</h3><div style="overflow-x:auto"><table>
     <tr><th>Signal</th><th class="n">Tier</th><th>Evidence</th><th>Output</th><th class="n">Turnover</th><th>Known failure modes</th></tr>
     ${signals.map(s=>`<tr><td><b>${H(s.name)}</b></td><td class="n">${s.tier}</td>
       <td>${H(s.evidence)}</td><td class="muted">${H(s.output)}</td>
       <td class="n">${P(s.turnover,0)}</td>
       <td class="muted" style="max-width:520px">${H(s.fails_when)}</td></tr>`).join("")}
     </table></div></div>`;
}
async function runSignal() {
  const b = event.target; b.disabled = true;
  $("#so").innerHTML = `<p class="spin">computing…</p>`;
  const d = await post("/api/run/signal",{signal:$("#sg").value,as_of:$("#sa").value,symbols:$("#sy").value});
  b.disabled = false;
  if (!d.ok) { $("#so").innerHTML = `<div class="verdict bad">${d.unavailable?"This signal refuses to run:\n\n":""}${H(d.error)}</div>`; return; }
  $("#so").innerHTML = `<div class="panel"><h3>${H(d.signal)} — ${H(d.as_of)}</h3>
    ${barChart(d.scores.map(s=>({k:s.symbol,v:s.score})),{fmt:v=>SIGN(v,3)})}
    <p class="muted" style="margin-top:10px">${H(d.note)}</p></div>`;
}

/* ----------------------------------------------------------------- sweep */
async function viewSweep() {
  const {signals} = await get("/api/signals");
  $("#view").innerHTML = `<h2>Sweep</h2>
   <p class="lede">Does the idea work everywhere, or only on some names? Every cell is a
    trial. The spread across cells is judged against the null that the signal has no edge
    anywhere — under which Var(t) = 1. On pure noise, a naive |t| ≥ 2 read reports a
    winner <b>54% of the time</b>; after this correction, one cell in 2,800.</p>
   <div class="panel"><div class="form">
     <div><label>Signal (blank = built-in trend)</label>
       <select id="wg"><option value="">(built-in trend rule)</option>
       ${signals.map(s=>`<option value="${H(s.name)}">${H(s.name)}</option>`).join("")}</select></div>
     <div><label>As of</label><input id="wa" value="{{ today }}"></div>
     <div><label>Instruments (blank = all)</label><input id="wy"></div>
   </div>
   <label>Parameter axes — needs a signal, one per line</label>
   <textarea id="wp" placeholder="vol_window=15,21,30,42,63,90,126"></textarea>
   <button onclick="runSweep()">Run sweep</button></div>
   <div id="wo"></div>`;
}
async function runSweep() {
  const b = event.target; b.disabled = true;
  $("#wo").innerHTML = `<p class="spin">sweeping — a real backtest per cell…</p>`;
  const d = await post("/api/run/sweep",{signal:$("#wg").value,as_of:$("#wa").value,
     symbols:$("#wy").value,parameters:$("#wp").value});
  b.disabled = false;
  if (!d.ok) { $("#wo").innerHTML = `<div class="verdict bad">${H(d.error)}</div>`; return; }
  const bars = d.cells.map(c=>({k:c.name,v:c.t,color:c.survives?COLORS[2]:(c.thin?"var(--muted)":COLORS[0])}));
  $("#wo").innerHTML =
    `<div class="verdict ${d.survivors.length?"good":"bad"}">${H(d.verdict)}</div>
     <div class="cards">
       <div class="kpi"><div class="k">Trials</div><div class="v">${d.trials}</div><div class="s">cells tested</div></div>
       <div class="kpi"><div class="k">Var(t)</div><div class="v">${N(d.variance)}</div><div class="s">1.00 under the null</div></div>
       <div class="kpi"><div class="k">Shrinkage</div><div class="v">${N(d.shrinkage)}</div><div class="s">applied to every cell</div></div>
       <div class="kpi"><div class="k">Survivors</div><div class="v">${d.survivors.length}</div><div class="s">|t| ≥ 2 after shrinkage</div></div>
     </div>
     <div class="panel"><h3>Raw t-statistic per ${H(d.dimension)}</h3>${barChart(bars)}</div>
     <div class="panel"><h3>Cells</h3><table>
       <tr><th>${H(d.dimension)}</th><th class="n">Sharpe</th><th class="n">t</th>
       <th class="n">t after shrinkage</th><th class="n">Years</th><th></th></tr>
       ${d.cells.map(c=>`<tr><td>${H(c.name)}</td><td class="n">${SIGN(c.sharpe)}</td>
         <td class="n">${SIGN(c.t)}</td><td class="n">${SIGN(c.shrunk_t)}</td>
         <td class="n">${N(c.years,1)}</td>
         <td>${c.survives?'<span class="tag t-ok">survives</span>':(c.thin?'<span class="muted">thin</span>':"")}</td></tr>`).join("")}
     </table></div>`;
}

/* ------------------------------------------------------------------ data */
async function viewData() {
  const [{datasets},{books}] = await Promise.all([get("/api/lake/summary"),get("/api/paper")]);
  const rows = datasets.map(d=>`<tr><td><b>${H(d.dataset)}</b></td><td class="muted">${H(d.source)}</td>
    <td>${H(d.asset_class)}</td><td class="n">${(d.rows||0).toLocaleString()}</td>
    <td class="n">${d.symbols}</td><td class="n">${d.megabytes}</td>
    <td class="muted">${H(d.earliest)} → ${H(d.latest)}</td></tr>`).join("");
  const paper = books.length ? books.map(b=>`<tr><td><b>${H(b.strategy)}</b></td>
    <td class="n">$${(b.equity/1e6).toFixed(3)}m</td><td class="n">${N(b.gross_exposure)}x</td>
    <td class="n">${b.positions}</td><td class="n">${b.cycles}</td>
    <td>${b.stale_days<4?`<span class="tag t-ok">${N(b.stale_days,1)}d</span>`:`<span class="tag t-warn">${N(b.stale_days,1)}d old</span>`}</td></tr>`).join("")
    : `<tr><td colspan="6" class="muted">No paper books yet.</td></tr>`;
  $("#view").innerHTML = `<h2>Data</h2>
    <p class="lede">What is actually in the lake. Everything here is point-in-time: a snapshot
     sees only what was knowable at its instant.</p>
    <div class="panel"><h3>Lake</h3><div style="overflow-x:auto"><table>
      <tr><th>Dataset</th><th>Source</th><th>Asset class</th><th class="n">Rows</th>
      <th class="n">Symbols</th><th class="n">MB</th><th>Span</th></tr>${rows}</table></div></div>
    <div class="panel"><h3>Paper books</h3><table>
      <tr><th>Strategy</th><th class="n">Equity</th><th class="n">Gross</th>
      <th class="n">Positions</th><th class="n">Cycles</th><th>Age</th></tr>${paper}</table>
      <p class="muted" style="margin-top:9px">Age is shown because a loop that silently
       stopped looks exactly like one holding steady.</p></div>`;
}

/* ---------------------------------------------------------------- trials */
async function viewTrials() {
  const d = await get("/api/trials");
  $("#view").innerHTML = `<h2>Trials</h2>
    <p class="lede">Every backtest records itself, and the count deflates the Sharpe it
     reports. A browser makes it much cheaper to try one more idea, so this number moves
     faster than it used to. There is no way to search quietly and still quote a deflated
     number.</p>
    <div class="cards"><div class="kpi"><div class="k">Total trials</div>
      <div class="v">${d.total}</div><div class="s">across ${d.families.length} families</div></div></div>
    <div class="panel"><table><tr><th>Family</th><th class="n">Trials</th><th class="n">Best Sharpe</th></tr>
      ${d.families.map(f=>`<tr><td>${H(f.family)}</td><td class="n">${f.trials}</td>
        <td class="n">${N(f.best_sharpe)}</td></tr>`).join("")||`<tr><td colspan="3" class="muted">Nothing recorded yet.</td></tr>`}
      </table></div>`;
}

/* ----------------------------------------------------------- instruments */
let INSTRUMENTS = [];
async function viewInstruments() {
  $("#view").innerHTML = `<h2>Instruments</h2><p class="spin">indexing the lake…</p>`;
  if (!INSTRUMENTS.length) INSTRUMENTS = (await get("/api/instruments")).instruments;
  renderInstruments("");
}
function renderInstruments(q) {
  const term = q.trim().toLowerCase();
  const hits = INSTRUMENTS.filter(i => !term
    || i.symbol.toLowerCase().includes(term)
    || (i.name||"").toLowerCase().includes(term)
    // Former names too: the CFTC's two-year note is now "UST 2Y NOTE" and was
    // "2 YEAR U.S. TREASURY NOTES". Someone typing "treasury" means that one.
    || (i.aliases||[]).some(a => a.toLowerCase().includes(term)));
  const rows = hits.slice(0, 250).map(i => `<tr class="click" onclick="viewInstrument('${H(i.symbol)}')">
      <td><b>${H(i.symbol)}</b></td>
      <td class="muted">${H(i.name||"")}</td>
      <td>${i.datasets.map(d=>`<span class="chip">${H(d)}</span>`).join(" ")}</td>
      <td class="n">${(i.rows||0).toLocaleString()}</td>
      <td class="muted">${H(i.first||"")} → ${H(i.last||"")}</td></tr>`).join("");
  $("#view").innerHTML = `<h2>Instruments</h2>
    <p class="lede">Every symbol the lake holds, built from the data rather than a
     maintained list — so nothing can be present in the data and missing here.
     Search by ticker or name.</p>
    <div class="search">
      <input id="iq" placeholder="corn, AAPL, BTC, treasury…" value="${H(q)}"
             oninput="renderInstruments(this.value)" autofocus>
      <span class="n">${hits.length} of ${INSTRUMENTS.length}${hits.length>250?" (showing 250)":""}</span>
    </div>
    <div class="panel"><table>
      <tr><th>Symbol</th><th>Name</th><th>Datasets</th><th class="n">Rows</th><th>Span</th></tr>
      ${rows || `<tr><td colspan="5" class="muted">No instrument matches “${H(q)}”.</td></tr>`}
    </table></div>`;
  const box = $("#iq"); if (box) { box.focus(); box.setSelectionRange(box.value.length, box.value.length); }
}
async function viewInstrument(sym) {
  $("#view").innerHTML = `<p class="spin">loading ${H(sym)}…</p>`;
  const d = await get("/api/instruments/" + encodeURIComponent(sym));
  if (!d.ok) { $("#view").innerHTML = `<div class="verdict bad">${H(d.error)}</div>`; return; }
  const st = d.stats;
  const kpis = st ? [
    ["Last close", N(st.last_close), `${H(st.last)}`],
    ["History", st.bars.toLocaleString()+" bars", `${H(st.first)} → ${H(st.last)}`],
    ["CAGR", P(st.cagr), `over ${N(st.years,1)} years`],
    ["Volatility", P(st.volatility), "annualised"],
    ["Max drawdown", P(st.max_drawdown), ""],
    ["Buy-and-hold Sharpe", N(st.buy_hold_sharpe), "not a strategy result"],
  ].map(([k,v,s])=>`<div class="kpi"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join("") : "";

  const hist = d.history || [];
  const charts = hist.length ? `
    <div class="panel"><h3>Price — log scale (${H(d.price_dataset)})</h3>
      ${lineChart([{name:sym,points:hist.map(p=>({x:Date.parse(p.t),y:p.close}))}],{yfmt:v=>N(v,v<10?2:0)})}</div>
    <div class="panel"><h3>Drawdown from peak</h3>
      ${lineChart([{name:"dd",points:hist.map(p=>({x:Date.parse(p.t),y:p.drawdown}))}],{log:false,h:150,yfmt:v=>P(v,0)})}</div>` : "";

  const fun = (d.fundamentals||[]).length ? `<div class="panel"><h3>Fundamentals — latest annual, as filed</h3>
      <table>${d.fundamentals.map(f=>`<tr><td>${H(f.metric)}</td>
        <td class="n">${Math.abs(f.value)>1e6?(f.value/1e9).toFixed(2)+"bn":N(f.value)}</td></tr>`).join("")}</table></div>` : "";

  const pos = (d.positioning||[]).length ? `<div class="panel"><h3>CFTC positioning — ${H(d.positioning[0].as_of)}</h3>
      <table><tr><th>Report</th><th>Category</th><th>Measure</th><th class="n">Contracts</th></tr>
      ${d.positioning.map(r=>`<tr><td class="muted">${H(r.report)}</td><td>${H(r.category)}</td>
        <td class="muted">${H(r.measure)}</td><td class="n">${r.value.toLocaleString()}</td></tr>`).join("")}</table></div>` : "";

  $("#view").innerHTML = `<h2>${H(d.symbol)}</h2>
    <p class="lede"><a onclick="go('instruments')" style="cursor:pointer;color:var(--accent)">&larr; all instruments</a>
      &nbsp;·&nbsp; point-in-time as of ${H(d.as_of)}</p>
    <div class="cards">${kpis}</div>${charts}
    <div class="panel"><h3>What the lake holds</h3><table>
      <tr><th>Dataset</th><th class="n">Rows</th><th>Span</th></tr>
      ${(d.datasets||[]).map(r=>`<tr><td>${H(r.dataset)}</td><td class="n">${r.rows.toLocaleString()}</td>
        <td class="muted">${H(r.first)} → ${H(r.last)}</td></tr>`).join("")}</table></div>
    ${fun}${pos}`;
}

/* ------------------------------------------------------------- portfolio */
function viewPortfolio() {
  $("#view").innerHTML = `<h2>Portfolio</h2>
   <p class="lede">How do these go together? Correlation is estimable from a few hundred
    observations in a way expected return is not, so this answers the reliable question.
    <b>Weights are the less interesting half</b> — risk share is what the book is actually
    exposed to. No expected returns are estimated.</p>
   <div class="panel"><div class="form">
     <div><label>Instruments</label><input id="pf" value="SPY, QQQ, TLT, GLD, EEM, USO"></div>
     <div><label>Method</label><select id="pm">
       <option value="risk-parity">risk parity — equal risk</option>
       <option value="equal">equal weight</option>
       <option value="inverse-vol">inverse volatility</option>
       <option value="min-variance">minimum variance</option></select></div>
     <div><label>As of</label><input id="pa" value="{{ today }}"></div>
   </div><button onclick="runPortfolio()">Construct</button></div>
   <div id="po"></div>`;
}
function heat(v) {
  const t = Math.max(-1, Math.min(1, v));
  const c = t >= 0 ? [26,61,109] : [192,57,43];
  const a = 0.12 + 0.78*Math.abs(t);
  return `rgba(${c[0]},${c[1]},${c[2]},${a.toFixed(2)})`;
}
async function runPortfolio() {
  const b = event.target; b.disabled = true;
  $("#po").innerHTML = `<p class="spin">estimating covariance…</p>`;
  const syms = $("#pf").value;
  const d = await post("/api/portfolio", {symbols:syms, method:$("#pm").value, as_of:$("#pa").value});
  b.disabled = false;
  if (!d.ok) { $("#po").innerHTML = `<div class="verdict bad">${H(d.error)}</div>`; return; }
  const p = d.portfolio;

  const hist = await post("/api/portfolio/history", {
    symbols: d.positions.map(x=>x.symbol), weights: d.positions.map(x=>x.weight), as_of:$("#pa").value});

  const kpis = [
    ["Portfolio volatility", P(p.volatility), "annualised"],
    ["Average correlation", N(p.average_correlation,3), "pairwise"],
    ["Independent bets", N(p.independent_bets,1), `from ${p.instruments} instruments`],
    ["Effective positions", N(p.effective_positions,1), "inverse Herfindahl"],
  ].map(([k,v,s])=>`<div class="kpi"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join("");

  const sym = d.correlation.symbols, M = d.correlation.matrix;
  const heatmap = `<table class="hm"><tr><td></td>${sym.map(s=>`<td class="lbl">${H(s)}</td>`).join("")}</tr>
    ${M.map((row,i)=>`<tr><td class="lbl">${H(sym[i])}</td>
      ${row.map(v=>`<td class="cell" style="background:${heat(v)}">${v.toFixed(2)}</td>`).join("")}</tr>`).join("")}</table>`;

  $("#po").innerHTML = `<div class="cards">${kpis}</div>
    <div class="two">
      <div class="panel"><h3>Weight</h3>
        ${barChart(d.positions.map(x=>({k:x.symbol,v:x.weight})),{w:460,fmt:v=>P(v)})}</div>
      <div class="panel"><h3>Risk share — what you are actually exposed to</h3>
        ${barChart(d.positions.map(x=>({k:x.symbol,v:x.risk_share,color:COLORS[1]})),{w:460,fmt:v=>P(v)})}</div>
    </div>
    <div class="panel"><h3>Correlation</h3>${heatmap}
      <p class="muted" style="margin-top:10px">${p.instruments} instruments, average pairwise
       correlation ${N(p.average_correlation,3)} — worth about <b>${N(p.independent_bets,1)}
       independent bets</b>. Equicorrelation is a lower bound; genuine sector structure
       diversifies somewhat better.</p></div>
    ${hist.ok?`<div class="panel"><h3>How they moved together</h3>
      ${lineChart([{name:"pf",points:hist.points.map(p=>({x:Date.parse(p.t),y:p.value}))}],{h:220,yfmt:v=>N(v,2)})}
      <p class="muted" style="margin-top:8px">${H(hist.note)}</p></div>`:""}
    <div class="panel"><h3>Positions</h3><table>
      <tr><th>Symbol</th><th class="n">Weight</th><th class="n">Volatility</th><th class="n">Risk share</th></tr>
      ${d.positions.map(x=>`<tr><td><b>${H(x.symbol)}</b></td><td class="n">${P(x.weight)}</td>
        <td class="n">${P(x.volatility)}</td><td class="n">${P(x.risk_share)}</td></tr>`).join("")}
      </table>${d.dropped.length?`<p class="warn">Dropped for gaps over the window: ${d.dropped.map(H).join(", ")}</p>`:""}
      <p class="muted" style="margin-top:10px">${H(d.note)}</p></div>`;
}

/* ------------------------------------------------------------------ router */
const VIEWS = {instruments:viewInstruments, portfolio:viewPortfolio, overview:viewOverview,
               signals:viewSignals, sweep:viewSweep, data:viewData, trials:viewTrials};
function go(name) {
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on", a.dataset.v===name));
  VIEWS[name]();
}
document.querySelectorAll("nav a").forEach(a=>a.onclick=()=>go(a.dataset.v));
go("instruments");
</script>
