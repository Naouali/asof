# QuantLab stack.
#
# `make up` builds the shared base image first, then brings this up. Every service
# is healthchecked, resource-limited and runs as a non-root user.
#
# Note what is NOT here: there is no market-data database service. Bulk market data
# lives in the parquet lake on the `quantlab-data` volume and is queried in-process
# by DuckDB (spec 3.8). Postgres exists only for paper-trading state, the run
# registry and dashboard metadata.

x-quantlab-env: &quantlab-env
  QUANTLAB_ENV: docker
  QUANTLAB_DATA_ROOT: /data
  QUANTLAB_REPO_ROOT: /app
  QUANTLAB_LOG_LEVEL: ${QUANTLAB_LOG_LEVEL:-INFO}
  QUANTLAB_LOG_FORMAT: ${QUANTLAB_LOG_FORMAT:-json}
  QUANTLAB_OFFLINE: ${QUANTLAB_OFFLINE:-false}
  QUANTLAB_RANDOM_SEED: ${QUANTLAB_RANDOM_SEED:-20240101}
  QUANTLAB_HTTP_USER_AGENT: ${QUANTLAB_HTTP_USER_AGENT:-QuantLab/0.1 (unconfigured -- set QUANTLAB_HTTP_USER_AGENT)}
  QUANTLAB_POSTGRES_HOST: db
  QUANTLAB_POSTGRES_PORT: "5432"
  QUANTLAB_POSTGRES_USER: ${QUANTLAB_POSTGRES_USER:-quantlab}
  QUANTLAB_POSTGRES_PASSWORD: ${QUANTLAB_POSTGRES_PASSWORD:-quantlab}
  QUANTLAB_POSTGRES_DB: ${QUANTLAB_POSTGRES_DB:-quantlab}
  # API keys. Every one is optional and defaults to empty; `quantlab doctor`
  # reports which sources that makes unavailable (spec section 10).
  QUANTLAB_FRED_API_KEY: ${QUANTLAB_FRED_API_KEY:-}
  QUANTLAB_EIA_API_KEY: ${QUANTLAB_EIA_API_KEY:-}
  QUANTLAB_USDA_NASS_API_KEY: ${QUANTLAB_USDA_NASS_API_KEY:-}
  QUANTLAB_NASDAQ_DATA_LINK_API_KEY: ${QUANTLAB_NASDAQ_DATA_LINK_API_KEY:-}
  QUANTLAB_ALPHA_VANTAGE_API_KEY: ${QUANTLAB_ALPHA_VANTAGE_API_KEY:-}
  QUANTLAB_TIINGO_API_KEY: ${QUANTLAB_TIINGO_API_KEY:-}
  QUANTLAB_FMP_API_KEY: ${QUANTLAB_FMP_API_KEY:-}

x-quantlab-build: &quantlab-build
  args:
    BASE_IMAGE: quantlab-base:local
    UID: ${QUANTLAB_UID:-1000}
    GID: ${QUANTLAB_GID:-1000}

# Bind mounts for live development. The editable install inside the image points at
# /app/src, so editing ./src on the host takes effect without a rebuild.
x-quantlab-code: &quantlab-code
  - ./src:/app/src:ro
  - ./configs:/app/configs:ro
  - ./tests:/app/tests:ro

services:
  db:
    # TimescaleDB for the paper-trading time series (marks, fills, equity curve).
    # Pinned to a digest-stable tag; both linux/amd64 and linux/arm64 are published.
    image: timescale/timescaledb:2.17.2-pg16
    container_name: quantlab-db
    environment:
      POSTGRES_USER: ${QUANTLAB_POSTGRES_USER:-quantlab}
      POSTGRES_PASSWORD: ${QUANTLAB_POSTGRES_PASSWORD:-quantlab}
      POSTGRES_DB: ${QUANTLAB_POSTGRES_DB:-quantlab}
      # Deterministic collation, so ORDER BY on text is identical on every machine.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - quantlab-pgdata:/var/lib/postgresql/data
    # Not published to the host by default: nothing outside the compose network
    # needs it, and an exposed Postgres with a default password is a liability.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${QUANTLAB_POSTGRES_USER:-quantlab} -d ${QUANTLAB_POSTGRES_DB:-quantlab}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
      <<: *quantlab-build
    image: quantlab-worker:local
    container_name: quantlab-worker
    environment: *quantlab-env
    volumes:
      - quantlab-data:/data
      - ./src:/app/src:ro
      - ./configs:/app/configs:ro
      - ./tests:/app/tests:ro
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "4.0", memory: 8g }

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
      <<: *quantlab-build
    image: quantlab-worker:local
    container_name: quantlab-scheduler
    command: ["quantlab", "scheduler", "run"]
    healthcheck:
      test: ["CMD", "quantlab", "scheduler", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    environment: *quantlab-env
    volumes:
      - quantlab-data:/data
      - ./src:/app/src:ro
      - ./configs:/app/configs:ro
    depends_on:
      db: { condition: service_healthy }
      worker: { condition: service_healthy }
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
      <<: *quantlab-build
    image: quantlab-dashboard:local
    container_name: quantlab-dashboard
    environment: *quantlab-env
    volumes:
      - quantlab-data:/data
      - ./src:/app/src:ro
      - ./configs:/app/configs:ro
    # Bound to loopback: the dashboard has no authentication, so it must not be
    # reachable from the local network.
    ports:
      - "127.0.0.1:${QUANTLAB_DASHBOARD_PORT:-8080}:8000"
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }

  research:
    build:
      context: .
      dockerfile: docker/Dockerfile.research
      <<: *quantlab-build
    image: quantlab-research:local
    container_name: quantlab-research
    environment: *quantlab-env
    volumes:
      - quantlab-data:/data
      # Notebooks are writable; source is read-only from the container's side so a
      # notebook cannot quietly edit the library it is supposed to be exercising.
      - ./notebooks:/app/notebooks
      - ./src:/app/src:ro
      - ./configs:/app/configs:ro
    ports:
      - "127.0.0.1:${QUANTLAB_JUPYTER_PORT:-8888}:8888"
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "4.0", memory: 8g }

volumes:
  # Named, so ingested data survives `docker compose down` and image rebuilds
  # (spec section 10). `make clean-data` is the only thing that removes it.
  quantlab-data:
    name: quantlab-data
  quantlab-pgdata:
    name: quantlab-pgdata
