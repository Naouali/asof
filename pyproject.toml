[project]
name = "quantlab"
version = "0.1.0"
description = "Multi-asset quantitative research and backtesting platform built on free data sources."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "QuantBox" }]

# NOTE ON PINNING (spec section 1: "Reproducible").
# Direct dependencies carry compatible-range constraints here; the *exact* resolved
# version of every direct and transitive dependency is pinned in `uv.lock`, which is
# committed and is what the Docker images install (`uv sync --frozen`). Never install
# with plain `pip install quantlab` in an image -- that bypasses the lock.
dependencies = [
  # --- dataframes / storage / query -------------------------------------------------
  # Polars, not pandas: spec 3.8 + 13. Lazy evaluation and the absence of an implicit
  # index make accidental time-misalignment look-ahead bugs much harder to write.
  "polars>=1.17,<2.0",
  "pyarrow>=18.1,<21.0",
  "duckdb>=1.1.3,<2.0",
  # --- numerics ---------------------------------------------------------------------
  "numpy>=2.1,<3.0",
  "scipy>=1.14,<2.0",
  # --- config / cli / logging -------------------------------------------------------
  "typer>=0.15,<0.17",
  "rich>=13.9,<15.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "pyyaml>=6.0.2,<7.0",
  "structlog>=24.4,<26.0",
  # --- http / ingest ----------------------------------------------------------------
  "httpx>=0.28,<0.29",
  "tenacity>=9.0,<10.0",
  # --- calendars --------------------------------------------------------------------
  "exchange-calendars>=4.8,<5.0",
  # --- paper-trading state / run registry (Postgres only; never bulk market data) ----
  "sqlalchemy>=2.0.36,<3.0",
  "psycopg[binary]>=3.2.3,<4.0",
  "alembic>=1.14,<2.0",
  # --- scheduling -------------------------------------------------------------------
  "apscheduler>=3.11,<4.0",
  # --- dashboard --------------------------------------------------------------------
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "jinja2>=3.1.4,<4.0",
]

[project.optional-dependencies]
research = [
  "jupyterlab>=4.3,<5.0",
  "ipywidgets>=8.1.5,<9.0",
  "matplotlib>=3.9,<4.0",
  "plotly>=5.24,<7.0",
  "statsmodels>=0.14.4,<1.0",
  "scikit-learn>=1.6,<2.0",
  # pandas is present ONLY for interop with libraries that demand it (statsmodels,
  # Ken French CSV parsing). It is banned from the signal path -- see spec section 13
  # and the ruff TID251 rule below, which makes `import pandas` an error inside
  # src/quantlab/signals/ and src/quantlab/backtest/.
  "pandas>=2.2.3,<3.0",
]

# `dev` is a PEP 735 dependency group, not an extra: uv installs it by default and
# `uv sync --no-dev` excludes it, which is exactly the split the Docker stages need
# (the dev stage gets pytest/ruff/mypy; no runtime service image ever does).
[dependency-groups]
dev = [
  "pytest>=8.3.4,<9.0",
  "pytest-cov>=6.0,<8.0",
  "pytest-timeout>=2.3,<3.0",
  "hypothesis>=6.122,<7.0",
  "ruff>=0.8.4,<0.15",
  "mypy>=1.14,<2.0",
  "types-pyyaml>=6.0.12,<7.0",
]

[project.scripts]
quantlab = "quantlab.cli:app"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantlab"]

# ----------------------------------------------------------------------------------
# Lint
# ----------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "UP",        # pyupgrade
  "B",         # bugbear
  "C4",        # comprehensions
  "SIM",       # simplify
  "S",         # flake8-bandit: this platform makes HTTP calls and spawns subprocesses
  "TID",       # tidy imports (banned-api lives here)
  "PTH",       # use pathlib
  "RUF",
]
ignore = [
  "E501",   # line length is handled by the formatter
  "B008",   # typer uses function calls in argument defaults by design
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "S608"]  # asserts, subprocesses and deliberately-malicious SQL are the point
"scripts/**" = ["S603"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Spec section 13: "Do not use pandas indexed joins in the signal path where a
# time-misalignment bug could hide." Enforced mechanically rather than by convention.
"pandas".msg = "pandas is banned in the signal/backtest path -- use polars (see docs/ASSUMPTIONS.md)."

[tool.ruff.format]
quote-style = "double"

# ----------------------------------------------------------------------------------
# Types
# ----------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"  # matches the Docker images; numpy stubs need 3.12 syntax
files = ["src/quantlab"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["exchange_calendars.*", "apscheduler.*", "duckdb.*"]
ignore_missing_imports = true

# ----------------------------------------------------------------------------------
# Tests
# ----------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
timeout = 300
markers = [
  "integration: end-to-end tests that touch the compose stack or the data lake",
  "network: tests that require internet access (skipped by default in CI)",
  "slow: long-running tests",
]
filterwarnings = ["error::DeprecationWarning:quantlab.*"]

[tool.coverage.run]
source = ["src/quantlab"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:"]

# Spec section 11: >85% on costs, validation, backtest and data/pit is
# non-negotiable. data/pit exists as of Milestone 2 and the data layer as a whole
# sits at 91%; the floor rises again as costs (M3), backtest (M4) and validation
# (M5) land.
fail_under = 85
