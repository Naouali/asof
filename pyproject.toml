[project]
name = "quantlab"
version = "0.1.0"
description = "Multi-asset market data ETL: fetches free data sources into a point-in-time parquet lake."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "QuantBox" }]

# NOTE ON PINNING (spec section 1: "Reproducible").
# Direct dependencies carry compatible-range constraints here; the *exact* resolved
# version of every direct and transitive dependency is pinned in `uv.lock`, which is
# committed and is what the Docker images install (`uv sync --frozen`). Never install
# with plain `pip install quantlab` in an image -- that bypasses the lock.
dependencies = [
  # --- dataframes / storage / query -------------------------------------------------
  # Polars, not pandas: spec 3.8 + 13. Lazy evaluation and the absence of an implicit
  # index make accidental time-misalignment look-ahead bugs much harder to write.
  "polars>=1.17,<2.0",
  "pyarrow>=18.1,<21.0",
  "duckdb>=1.1.3,<2.0",
  # --- config / cli / logging -------------------------------------------------------
  "typer>=0.15,<0.17",
  "rich>=13.9,<15.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "pyyaml>=6.0.2,<7.0",
  "structlog>=24.4,<26.0",
  # --- http / ingest ----------------------------------------------------------------
  "httpx>=0.28,<0.29",
  # --- parsing disclosure filings -----------------------------------------------------
  # SEC ownership and 13F filings are XML fetched from the network, so they go through
  # defusedxml rather than the stdlib parser. House disclosures exist only as PDF.
  "defusedxml>=0.7.1,<0.8",
  "pypdf>=5.1,<7.0",
  # --- calendars --------------------------------------------------------------------
  "exchange-calendars>=4.8,<5.0",
  # --- scheduling -------------------------------------------------------------------
  "apscheduler>=3.11,<4.0",
  # --- the web app: a read-only API over the lake, which also serves the built UI ----
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
]

# `dev` is a PEP 735 dependency group, not an extra: uv installs it by default and
# `uv sync --no-dev` excludes it, which is exactly the split the Docker stages need
# (the dev stage gets pytest/ruff/mypy; no runtime service image ever does).
[dependency-groups]
dev = [
  "pytest>=8.3.4,<9.0",
  "pytest-cov>=6.0,<8.0",
  "pytest-timeout>=2.3,<3.0",
  "ruff>=0.8.4,<0.15",
  "mypy>=1.14,<2.0",
  "types-pyyaml>=6.0.12,<7.0",
  "types-defusedxml>=0.7.0,<0.8",
]

[project.scripts]
quantlab = "quantlab.cli:app"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantlab"]

# ----------------------------------------------------------------------------------
# Lint
# ----------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "UP",        # pyupgrade
  "B",         # bugbear
  "C4",        # comprehensions
  "SIM",       # simplify
  "S",         # flake8-bandit: this platform makes HTTP calls and spawns subprocesses
  "TID",       # tidy imports (banned-api lives here)
  "PTH",       # use pathlib
  "RUF",
]
ignore = [
  "E501",   # line length is handled by the formatter
  "B008",   # typer uses function calls in argument defaults by design
]

allowed-confusables = ["·", "−", "×", "≈", "≤", "≥"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "S608"]  # asserts, subprocesses and deliberately-malicious SQL are the point
"scripts/**" = ["S603"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# An implicit index is where time-misalignment bugs hide. Enforced mechanically
# rather than by convention.
"pandas".msg = "pandas is banned in this repository -- use polars."

[tool.ruff.format]
quote-style = "double"

# ----------------------------------------------------------------------------------
# Types
# ----------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"  # matches the Docker images; numpy stubs need 3.12 syntax
files = ["src/quantlab"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["exchange_calendars.*", "apscheduler.*", "duckdb.*"]
ignore_missing_imports = true

# ----------------------------------------------------------------------------------
# Tests
# ----------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Test modules import shared helpers as `tests.conftest`, so the repository root
# has to be importable however pytest is started (`uv run pytest` does not add it).
pythonpath = ["."]
# Slow tests (the Docker stack integration tests) are excluded by default.
addopts = "-ra --strict-markers --strict-config -m 'not slow'"
timeout = 300
markers = [
  "integration: end-to-end tests that touch the compose stack or the data lake",
  "network: tests that require internet access (skipped by default in CI)",
  "slow: long-running tests",
]
filterwarnings = ["error::DeprecationWarning:quantlab.*"]

[tool.coverage.run]
source = ["src/quantlab"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:"]

fail_under = 85
