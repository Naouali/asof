# Scheduled jobs for the `scheduler` service. Times are UTC -- market-local
# conversions belong in the trading calendars, not here, where a DST shift could
# silently move a job across a data release.
#
# Commands are passed to `python -m quantlab`, so `["data", "ingest"]` runs
# `quantlab data ingest`.

jobs:
  - name: ingest-daily
    description: Incremental pull of equities, macro and rates.
    cron: "30 5 * * 1-5"          # 05:30 UTC, weekdays: after US settlement, before Europe opens
    command:
      ["data", "ingest", "--incremental",
       "-f", "yahoo.ohlcv_daily", "-f", "yahoo.corporate_actions",
       "-f", "fred.series_observations", "-f", "alfred.series_observations"]
    timeout_seconds: 5400
    enabled: true

  - name: ingest-crypto
    description: >-
      Crypto trades continuously, so it updates on weekends too. Hourly rather than
      daily because binance.instruments is the only record of which symbols existed
      when: a delisted symbol simply stops being served, and that history cannot be
      recovered afterwards.
    cron: "10 * * * *"
    command:
      ["data", "ingest", "--incremental",
       "-f", "binance.ohlcv_bars", "-f", "binance.funding_rate", "-f", "binance.instruments"]
    timeout_seconds: 1800
    enabled: true

  - name: ingest-disclosures
    description: >-
      Insider, institutional and congressional disclosures. Runs after the US
      filing day is over everywhere it matters: EDGAR accepts until 22:00 Eastern
      and a House report is only knowable once its filing day has ended, which is
      04:00-05:00 UTC. The Senate is read from a mirror refreshed at 05:00 UTC.
      Tuesday to Saturday, so Friday evening's filings are caught.
    cron: "15 6 * * 2-6"
    command:
      ["data", "ingest", "--incremental",
       "-f", "sec_insider.insider_transactions", "-f", "sec_13f.institutional_holdings",
       "-f", "sec_ftd.fails_to_deliver",
       "-f", "house_clerk.congress_filings", "-f", "house_clerk.congress_trades",
       "-f", "senate_efd.congress_filings", "-f", "senate_efd.congress_trades"]
    timeout_seconds: 5400
    enabled: true

  - name: options-snapshot
    description: >-
      Daily options chain snapshot. There is no free historical options data, so
      our history starts the day this job starts running -- every day it is
      disabled is a day of history that can never be recovered.
    cron: "0 21 * * 1-5"          # 21:00 UTC ~= 16:00 ET, after the US close
    command: ["data", "ingest", "-f", "options_snapshot.chain_snapshot"]
    timeout_seconds: 1800
    enabled: true

  - name: doctor
    description: Environment self-check.
    cron: "0 6 * * *"
    command: ["doctor"]
    timeout_seconds: 300
    enabled: true
