# The default ingest plan.
#
# Jobs run in order; each writes to the lake as it completes, so a failure halfway
# through keeps everything already fetched. Symbol lists are deliberately small:
# a default that pulls thousands of symbols gets you rate-limited on your first run.
# Widen them once you know what you are researching.
#
#   quantlab data ingest                    # everything enabled here
#   quantlab data ingest --incremental      # resume from what the lake already has
#   quantlab data ingest --fetcher binance.ohlcv_bars
#   quantlab data ingest --dry-run          # show the windows without fetching

defaults:
  start: "2015-01-01"

jobs:
  # ---------------------------------------------------------------- crypto ----
  # The best free data in the system: no key, full history, real bar-close
  # timestamps. Start at Binance's own beginning rather than the global default.
  - fetcher: binance.ohlcv_bars
    description: Daily spot bars for the major pairs.
    start: "2017-08-17"
    options:
      interval: 1d
    symbols: [BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT, XRPUSDT, ADAUSDT, DOGEUSDT, LINKUSDT]

  - fetcher: binance.funding_rate
    description: >-
      Perpetual funding history -- the input to crypto carry. Funding began on the
      USD-margined contracts in late 2019.
    start: "2019-09-08"
    symbols: [BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT, XRPUSDT, ADAUSDT, DOGEUSDT, LINKUSDT]

  - fetcher: binance.instruments
    description: >-
      Daily snapshot of the traded universe. This is the ONLY defence against crypto
      survivorship bias: delisted symbols stop being served, so universe history
      exists only from the day this job starts running. Every day it is skipped is a
      day that cannot be recovered. Runs hourly in configs/schedule.yaml.
    symbols: []

  # ---------------------------------------------------------------- equity ----
  - fetcher: yahoo.ohlcv_daily
    description: >-
      Daily bars. Survivorship-biased (delisted tickers vanish) and retroactively
      split-adjusted, so use returns, not price levels. See docs/LIMITATIONS.md.
    start: "2005-01-01"
    symbols: [SPY, QQQ, IWM, DIA, TLT, IEF, GLD, SLV, USO, HYG, LQD, EFA, EEM, VNQ,
              # The EDGAR fundamentals universe.
              AAPL, MSFT, JNJ, KO, PG, XOM, JPM, PFE, WMT, HD, CVX, MRK, PEP, CSCO, INTC,
              # The insider-transactions universe, so a ticker page has a price
              # to draw its disclosures against.
              NVDA, AMZN, GOOGL, META, TSLA, UNH]

  - fetcher: yahoo.ohlcv_daily
    description: >-
      Daily bars for the federal contractors, so their pages have a price to draw
      contracts against. A job of its own because of its start: Yahoo answers a
      window that ends before a company was listed with an error, not with
      nothing, and Amentum only listed in 2024. From 2019 every window holds data.
      PFE, MRK and UNH are in the job above.
    start: "2019-01-01"
    symbols: [LMT, BA, RTX, GD, NOC, LDOS, HII, MCK, FLR, LHX, BAH, AMTM, HUM, CACI,
              SAIC, COR, TXT, ORCL, HON, PLTR, GE, GEO, VVX, KBR, RS, T, PSN, OSK,
              TKR, IBM, FDX, MMS, TPC, SNEX]

  - fetcher: yahoo.corporate_actions
    description: >-
      Dividends and splits with their own ex-dates -- the honest route to total
      returns, since Yahoo's adj_close is restated under you.
    start: "2005-01-01"
    symbols: [SPY, QQQ, IWM, DIA, TLT, IEF, GLD, SLV, USO, HYG, LQD, EFA, EEM, VNQ,
              # The EDGAR fundamentals universe.
              AAPL, MSFT, JNJ, KO, PG, XOM, JPM, PFE, WMT, HD, CVX, MRK, PEP, CSCO, INTC,
              # The insider-transactions universe, so a ticker page has a price
              # to draw its disclosures against.
              NVDA, AMZN, GOOGL, META, TSLA, UNH]

  - fetcher: stooq.ohlcv_daily
    description: >-
      DISABLED. As of 2026-09-20 Stooq gates its CSV endpoint behind a JavaScript
      proof-of-work anti-bot challenge, which QuantLab does not solve. Enabling this
      job will fail loudly rather than silently returning nothing. The independent
      cross-check on Yahoo's undocumented adjustments is therefore unavailable.
    enabled: false
    symbols: [aapl.us, msft.us]

  # --------------------------------------------------------- academic factors --
  # ------------------------------------------------------------------ options ----
  # THE ONLY DATASET HERE THAT CANNOT BE BACKFILLED. No free source sells
  # historical option chains, so this history begins the day the collector first
  # runs and every day it is skipped is gone for good. Scheduled daily in
  # configs/schedule.yaml for that reason.
  #
  # One SPX chain is ~20,000 quotes a day with open interest. Widen the symbol
  # list deliberately: each additional underlying is another chain every day,
  # for ever.
  - fetcher: options_snapshot.chain_snapshot
    description: Daily option chain snapshot from CBOE delayed quotes.
    symbols: [SPX]

  # -------------------------------------------------------- the literature ----
  # Every published cross-sectional equity predictor Chen & Zimmermann could
  # find, with the t-statistic the original paper reported. This is the trial
  # count of the entire literature, and the input to reading your own honestly.
  - fetcher: open_asset_pricing.anomaly_catalogue
    description: Published anomalies, with original effect sizes and replication grades.
    start: "1900-01-01"
    symbols: []

  # ------------------------------------------------------------- volatility ----
  # VIX and relatives, as INDEX LEVELS in series_observations rather than bars.
  # VIX spot cannot be bought -- the tradeable expressions are futures, options
  # and ETPs, each with its own roll cost -- so filing it where the engine treats
  # it as tradeable would let a strategy collect a return nobody could earn.
  - fetcher: cboe.series_observations
    description: CBOE volatility indices. VIX reaches back to 1990.
    start: "1990-01-01"
    symbols: [VIX, VIX9D, VIX3M, VIX6M, VVIX]

  # ----------------------------------------------------------- fundamentals ----
  # The only free source of AS-FILED fundamentals. `as_of` is the period end and
  # `known_at` is the filing date, so a backtest sees 2015 through 2015's eyes
  # rather than through today's restatements. No API key -- EDGAR asks only for a
  # User-Agent with real contact details (QUANTLAB_HTTP_USER_AGENT).
  #
  # The universe is short deliberately: each company's facts payload is several
  # megabytes (Apple's is 3.8 MB), so widening this to thousands of tickers is
  # gigabytes of download and an hour of polite pacing.
  - fetcher: sec_edgar.fundamentals
    description: As-filed US company fundamentals from the XBRL company-facts API.
    start: "2010-01-01"
    symbols: [AAPL, MSFT, JNJ, KO, PG, XOM, JPM, PFE, WMT, HD, CVX, MRK, PEP, CSCO, INTC]

  # ------------------------------------------------------- disclosed trades ----
  # Insiders, institutions and politicians. Nobody here OBSERVES a trade: each of
  # these is a legal disclosure filed days to months after the fact. `as_of` is
  # when the trade happened and `known_at` is when the disclosure became public,
  # and every window below filters on the second. Reading them by `as_of` is how
  # "follow the smart money" results get manufactured.

  - fetcher: sec_insider.insider_transactions
    description: >-
      Form 4 and 5 transactions by officers, directors and 10% owners. One request
      per filing and a large issuer files a few hundred a year, so this list and
      start date cost roughly fifteen minutes on a first run. Filter on
      transaction_code before reading anything into it: only P and S are
      open-market decisions; A, M, F and G are compensation and gifts.
    start: "2024-01-01"
    symbols: [AAPL, MSFT, NVDA, AMZN, GOOGL, META, TSLA, JPM, XOM, UNH]

  - fetcher: sec_13f.institutional_holdings
    description: >-
      Quarter-end long positions of chosen managers. Symbols are manager CIKs,
      written WITHOUT leading zeros: Berkshire Hathaway, Bridgewater, Renaissance
      Technologies, Pershing Square, Scion, Citadel Advisors, Baupost, Tiger
      Global. Find a CIK at https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany
      -- names are refused, because they are not unique and they change.
      Securities are identified by CUSIP; sec_ftd.fails_to_deliver is the bridge
      to a ticker.
    start: "2014-01-01"
    symbols: [1067983, 1350694, 1037389, 1336528, 1649339, 1423053, 1061768, 1167483]

  - fetcher: sec_ftd.fails_to_deliver
    description: >-
      Fails-to-deliver balances for every security, twice a month. About sixty
      thousand rows and 1.4 MB a file, so an earlier start is cheap in requests
      and heavy in rows. Also the only free CUSIP-to-ticker bridge for the 13F
      holdings above.
    start: "2025-01-01"
    symbols: []

  - fetcher: house_clerk.congress_filings
    description: >-
      The index of every House financial disclosure document. One small download
      a year. Kept so that a transaction report which could not be read shows up
      as a gap: listed here, absent from congress_trades.
    start: "2015-01-01"
    symbols: []

  - fetcher: house_clerk.congress_trades
    description: >-
      Trades parsed out of House periodic transaction reports. One PDF per report
      at one request a second, and the House files roughly five hundred a year,
      so each year of history is about ten minutes. Scanned paper reports cannot
      be read and yield nothing.
    start: "2025-01-01"
    symbols: []

  # The Senate's site answers only from inside the United States, so by default
  # these two read a mirror that a daily job on a US-hosted runner keeps on the
  # `senate-mirror` branch of this repository (.github/workflows/senate-mirror.yml).
  # `mirror_url` is where that branch is served from; a fork must point it at its
  # own repository. On a US machine, `direct: true` reads the Senate itself instead.
  # The mirror starts in 2025; an earlier start here is an error, not an empty year.
  # The overlap is wide because the mirror can run a day or two behind the Senate.
  - fetcher: senate_efd.congress_filings
    description: >-
      The index of Senate periodic transaction reports, paper ones included, so
      that a report nobody could read shows up as a gap rather than as a senator
      who did not trade.
    start: "2025-01-01"
    overlap_days: 14
    options:
      mirror_url: https://raw.githubusercontent.com/Naouali/asof/senate-mirror/senate
    symbols: []

  - fetcher: senate_efd.congress_trades
    description: >-
      Trades from Senate periodic transaction reports, known from the minute each
      report was filed. Paper reports are scans and yield nothing.
    start: "2025-01-01"
    overlap_days: 14
    options:
      mirror_url: https://raw.githubusercontent.com/Naouali/asof/senate-mirror/senate
    symbols: []

  # Federal contract actions for the companies in configs/contractors.yaml.
  # `symbols: []` means every company in that file; a ticker outside it is an
  # error, because contracts name legal entities and the file is the only link.
  # `min_obligation` is also what the app says its smallest contract action is.
  # The Pentagon publishes its actions 90 days late and `known_at` says so.
  - fetcher: usaspending.government_contracts
    description: >-
      New awards, funding, options and de-obligations of $1 million and over,
      filed under the listed parent's ticker. Four generated downloads a run, at
      about half a minute each.
    start: "2024-01-01"
    options:
      min_obligation: 1000000
    symbols: []

  # ------------------------------------------------------------ positioning ----
  # Weekly futures positioning. `as_of` is the Tuesday snapshot and `known_at` is
  # the Friday 15:30 ET release -- a three-day gap that is the most common
  # look-ahead bias in published COT research. Pre-1992 data is refused: the CFTC
  # compiled it retrospectively, so it was never knowable at its report date.
  - fetcher: cftc_cot.positioning
    options:
      report: legacy
    description: >-
      Legacy futures-only positioning. The only COT report with deep history
      (1992 weekly), and the source of the non-commercial series every published
      COT signal is built on.
    start: "1992-09-30"
    symbols: ["13874A", "209742", "002602", "001602", "088691", "084691", "043602", "042601", "099741", "097741", "098662"]

  - fetcher: cftc_cot.positioning
    options:
      report: disaggregated
    description: >-
      Splits the legacy commercial bucket into producers and swap dealers. A swap
      dealer hedging an index position is not a producer hedging a crop, and the
      legacy series conflates them. Begins 2006.
    start: "2006-06-13"
    symbols: ["002602", "001602", "088691", "084691"]

  - fetcher: cftc_cot.positioning
    options:
      report: tff
    description: >-
      Traders in Financial Futures: dealers, asset managers, leveraged funds.
      The financial-market analogue of the disaggregated report. Begins 2006.
    start: "2006-06-13"
    symbols: ["13874A", "209742", "043602", "042601", "099741", "097741", "098662"]

  - fetcher: ken_french.series_observations
    description: >-
      Daily Fama-French factors and momentum. The accepted benchmark for any
      equity factor built here: survivorship-bias-free, decades of history, free.
      Restated on every release, so these are a benchmark and a risk-model input,
      never a point-in-time signal input -- every row records vintage=false.
    start: "1990-01-01"
    symbols: [KF_MKT_RF, KF_SMB, KF_HML, KF_RF, KF_MOM]

  # ----------------------------------------------------------- macro / rates --
  # Both need a free FRED key. Without one these jobs are reported as skipped and
  # the rest of the plan still runs.
  - fetcher: fred.series_observations
    description: >-
      Never-revised series only: Treasury yields, policy rates, credit spreads, VIX.
      known_at is the observation date plus the publication lag.
    start: "1990-01-01"
    symbols:
      [DGS1MO, DGS3MO, DGS6MO, DGS1, DGS2, DGS5, DGS10, DGS30,
       T10Y2Y, T10Y3M, DFF, SOFR, BAMLH0A0HYM2, BAMLC0A0CM, VIXCLS]

  - fetcher: alfred.series_observations
    description: >-
      Revised macro series, every vintage, with known_at set to the vintage start.
      This is the only honest way to build a macro signal. It is slow -- one row per
      (observation, vintage) pair -- so run it incrementally.
    start: "1990-01-01"
    symbols: [GDPC1, CPIAUCSL, PAYEMS, UNRATE, INDPRO, PCEPILFE, HOUST, UMCSENT]
