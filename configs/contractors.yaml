# Listed federal contractors, and the government's parent-company identifiers for each.
#
# A federal contract names a legal entity ("Sikorsky Aircraft Corporation"), never a
# ticker. The government groups entities under a PARENT, identified by a UEI, and
# this file is the only link from a parent to a listed company. Nothing official
# provides one, and matching by name would file contracts under the wrong company.
#
# Rules this list follows:
#   - One company, several parents: the government files some subsidiaries as
#     parents of their own, so they are listed under their owner, with a note.
#   - No joint ventures: they belong to no single ticker.
#   - No parents listed abroad: their US tickers are depositary receipts.
#   - Every ticker was checked against the SEC's list of registrants.
#
# Compiled 2026-09-21 from USAspending's ranking of its largest contract recipients
# (POST https://api.usaspending.gov/api/v2/recipient/ with award_type "contracts").
# A company missing from this file has NO contracts in the lake: it is absent, not
# idle. After an acquisition the government's own parent records lag by months.
#
# To add a company: find its parent UEI in that ranking or on a USAspending
# recipient page, add it here, and re-run the ingest. The file is validated when
# it is loaded: a UEI claimed twice, or one that is not 12 characters, is an error.

