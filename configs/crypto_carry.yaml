# Crypto perpetual funding carry.
#
# The best free data in the platform: no key, full history, real bar-close
# timestamps, and funding is an observed cash flow rather than an estimate.
# That makes this the most honest backtest here -- the cost model still has to
# be trusted, but the signal's own input is not a proxy for anything.
name: crypto-carry-funding
as_of: "2026-09-18"
start: "2020-01-01"
dataset: ohlcv_bars
source: binance

symbols: [BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT, XRPUSDT, ADAUSDT, DOGEUSDT, LINKUSDT]

weights: ../data/runs/crypto_carry_weights.parquet

# Binance spot taker fee is 10 bp; the quoted spread on the majors is far
# tighter than any equity assumption here, so this is the one asset class where
# the spread is close to observed rather than assumed.
spread_bps: 1.0
liquidity_window: 63

engine:
  initial_equity: 10_000_000
  execution: next_open
  max_staleness_bars: 3
  delisting_return: -0.30
  # Perpetuals: no stock borrow, and funding is already in the signal's cash
  # flow rather than charged again here.
  borrow_bps_annual: 0
  financing_bps_annual: 0
  commission_bps: 10.0

impact:
  y: 0.5
  delta: 0.5
  permanent_fraction: 0.5
